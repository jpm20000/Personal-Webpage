<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <title>Page not found</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <div data-bg></div>
  <main id="main" class="wrap error-page">
    <p class="eyebrow">404</p>
    <h1>This page drifted off the map.</h1>
    <p class="lede">The page you were looking for doesn't exist or has moved.</p>
    <div class="hero-actions">
      <a class="btn" href="/index.html">Back to home</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.js"></script>
  <script src="/assets/js/bg.config.js"></script>
  <script src="/assets/js/bg.js"></script>
  <script src="/assets/js/theme.js"></script>
</body>
</html>
